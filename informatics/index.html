<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Информатика и искусственный интеллект</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="wrap">

  <div class="top">
    <a class="back" href="/">← На главную</a>
    <div class="badge">💻 Информатика и ИИ</div>
  </div>

  <section class="panel">
    <h1>Выбери класс</h1>
    <p>Открой свою параллель и выбери нужную неделю.</p>

    <div class="grid" style="margin-top:24px">

      <div class="choice" style="opacity:.45">
        <div class="icon">2️⃣</div>
        <strong>2 класс</strong>
        <span>Скоро</span>
      </div>

      <div class="choice" style="opacity:.45">
        <div class="icon">3️⃣</div>
        <strong>3 класс</strong>
        <span>Скоро</span>
      </div>

      <div class="choice" style="opacity:.45">
        <div class="icon">4️⃣</div>
        <strong>4 класс</strong>
        <span>Скоро</span>
      </div>

      <a class="choice blue" href="/informatics/5/">
        <div class="icon">5️⃣</div>
        <strong>5 класс</strong>
        <span>Открыть недели</span>
      </a>

      <div class="choice" style="opacity:.45">
        <div class="icon">6️⃣</div>
        <strong>6 класс</strong>
        <span>Скоро</span>
      </div>

      <div class="choice" style="opacity:.45">
        <div class="icon">7️⃣</div>
        <strong>7 класс</strong>
        <span>Скоро</span>
      </div>

    </div>
  </section>

</div>
</body>
</html>
