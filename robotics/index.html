<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Future Robotics — AI Class FS</title><link rel="stylesheet" href="/styles.css"><style>
:root{--navy:#12214a;--teal:#16b8ae}body{background:radial-gradient(circle at top right,#e0f8f4,transparent 40%),#f5f8ff}.hero{background:linear-gradient(115deg,#12214a,#21417a);color:white;border-radius:28px;padding:38px;margin-bottom:24px;position:relative;overflow:hidden}.hero h1{font-size:clamp(38px,6vw,66px);margin:12px 0}.hero p{color:#d5e9ff;max-width:650px}.hero .eyebrow{color:#7ff6db;font-weight:900;letter-spacing:2px}.grades{display:flex;flex-wrap:wrap;gap:12px;margin:18px 0 24px}.grades button{background:white;color:#1b3471;border:2px solid #d4e3f5}.grades button[aria-pressed=true]{background:#193d78;color:white;border-color:#193d78}.cards-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.project{border:1px solid #e1eaf5;border-radius:20px;background:white;padding:19px;min-height:164px;display:flex;flex-direction:column;justify-content:space-between;color:#172a51;text-decoration:none;box-shadow:0 8px 26px #1e46700b}.project .number{font-size:13px;font-weight:800;color:#7184a7}.project strong{font-size:20px}.project .status{font-size:12px;font-weight:800;color:#63809f}.project.live{background:linear-gradient(140deg,#e9fbf6,#fff);border:2px solid #3ec9b5}.project.live .status{color:#087d62}.project:not(.live){opacity:.65;cursor:default}.project .emoji{font-size:33px}.hint{margin:20px 0;color:#65738a}@media(max-width:920px){.cards-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.cards-grid{grid-template-columns:repeat(2,1fr)}.hero{padding:24px}.project{padding:13px;min-height:145px}.project strong{font-size:16px}}
 .reference-link{display:inline-flex;padding:14px 18px;background:#d7f8ee;color:#0b6959;border-radius:14px;font-weight:900;text-decoration:none}.reference-link:hover{background:#aaf2df}.difficulty{display:inline-block;margin:8px 0;padding:6px 10px;border-radius:20px;font-size:12px;font-weight:900;background:#e8f0ff;color:#214886}.difficulty.mid{background:#fff1db;color:#9a601a}.difficulty.advanced{background:#f6e5f5;color:#7c397b}</style></head><body><main class="wrap"><div class="top"><a class="back" href="/">← AI Class FS</a><div class="badge">Arduino • Learn by making</div></div><header class="hero"><div class="eyebrow">FUTURE SCHOOL • ROBOTICS LAB</div><h1>Future Robotics <span aria-hidden="true">⚡</span></h1><p>От первой лампочки до умных устройств. Изучай детали, собирай схемы, понимай код и запускай реальные проекты на Arduino Uno.</p></header><section class="panel"><div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px"><h2 id="section-title">Лаборатория проектов</h2><a href="/robotics/components/" class="reference-link">📚 Справочник устройств →</a></div><div class="cards-grid" id="projects"></div></section></main><script>
const projects=["Светофор","Регулятор яркости","Зуммер — звуковой сигнал","Кнопка и Arduino","Умный ночник","Электронная игра","Счётчик на индикаторе","Кодовый замок","Датчик звука","Мини-метеостанция","Сервопривод","Джойстик","ИК-управление","Шаговый двигатель","RFID — электронный ключ"];
const difficulty=['начальный','начальный','начальный','начальный','начальный','средний','средний','средний','средний','средний','средний','средний','продвинутый','продвинутый','продвинутый'];const area=document.querySelector('#projects');for(let i=1;i<=34;i++){const active=i===1;const planned=i<=projects.length;const card=document.createElement(planned?'a':'div');card.className='project'+(planned?' live':'');if(planned)card.href=active?'/robotics/traffic-light/':'/robotics/lab/?n='+i;const title=planned?projects[i-1]:'Новый проект';card.innerHTML='<div><span class="number">ПРОЕКТ '+String(i).padStart(2,'0')+'</span><div class="emoji">'+(active?'🚦':planned?'🔧':'＋')+'</div><strong></strong></div><span class="status">'+(active?'● Открыть лабораторию →':planned?'● Открыть лабораторию →':'Место для будущего проекта')+'</span>';card.querySelector('strong').textContent=title;if(planned){const badge=document.createElement('span');badge.className='difficulty '+(i>12?'advanced':i>5?'mid':'');badge.textContent='Сложность: '+difficulty[i-1];card.querySelector('.status').before(badge)}area.append(card)}
</script></body></html>
